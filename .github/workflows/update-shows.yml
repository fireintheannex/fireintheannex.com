name: Update upcoming shows HTML
on:
  push:
    branches: [main]
    paths:
      - shows.json
      - index.template.html
      - scripts/build-shows.mjs
      - .github/workflows/update-shows.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-shows.mjs
      - name: Commit generated homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update crawlable shows"
            git push
          fi
